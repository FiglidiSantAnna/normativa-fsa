<style>
:root{--ink:#1d2433;--navy:#1d4a3b;--navy2:#2e6b57;--gold:#a5813f;--gold2:#f3ead7;--paper:#fbf8f2;--card:#fff;--line:#e6dfd0;--muted:#6b7280;--mark:#ffe58a;--cur:#ffb454;--ok:#2f7d4f;--rev:#b7791f;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;flex:none}
header .brand{font-weight:650;letter-spacing:.2px;background:none;border:0;color:#fff;padding:6px 4px;display:flex;align-items:center;gap:8px;white-space:nowrap}
header .brand svg{width:22px;height:22px}
.hsearch{flex:1;min-width:0;display:flex}
.hsearch input{flex:1;min-width:0;font-size:16px;padding:8px 12px;border:0;border-radius:18px;outline:none;background:#ffffff22;color:#fff}
.hsearch input::placeholder{color:#ffffffaa}
.hsearch input:focus{background:#fff;color:var(--ink)}
.hbtn{background:#ffffff1f;border:0;color:#fff;border-radius:16px;padding:7px 11px;font-size:14px;white-space:nowrap}
#langsel{background:#ffffff1f;color:#fff;border:0;border-radius:16px;padding:7px 8px;font-size:14px}
#langsel option{color:#000}
main{flex:1;min-height:0;display:flex;position:relative}
#view{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h2.sec{font:600 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
/* home */
.hero{background:linear-gradient(180deg,var(--navy) 0,#2a5f4c 100%);color:#fff;padding:22px 16px 26px}
.hero .in{max-width:788px;margin:0 auto}
.hero h1{font:600 26px/1.15 var(--serif);margin:0 0 4px}
.hero p{margin:0 0 16px;opacity:.85;font-size:15px}
.bigsearch{display:flex;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px #0003}
.bigsearch input{flex:1;min-width:0;border:0;outline:0;font-size:17px;padding:14px 14px;color:var(--ink)}
.bigsearch button{border:0;background:var(--gold);color:#fff;font-weight:600;padding:0 18px}
.hint{font-size:13px;opacity:.85;margin-top:10px;line-height:1.9}
.hint a{color:#fff;text-decoration:underline;cursor:pointer;margin-right:12px;white-space:nowrap;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;box-shadow:0 1px 2px #0000000a}
.tile:active{transform:scale(.98)}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--gold2);display:grid;place-items:center;font-size:18px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.books{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bk{display:flex;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.bk:first-child{border-top:0}
.bk:active{background:#f4efe3}
.bk .n{flex:none;width:36px;font:600 13px var(--sans);color:var(--gold)}
.bk .t{flex:1;min-width:0}
.bk .t b{display:block;font-weight:600;line-height:1.25}
.bk .c{flex:none;background:var(--navy);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);line-height:1.2}
.st i{width:8px;height:8px;border-radius:50%;background:var(--rev);flex:none}
.st.ok i{background:var(--ok)}
.legend{font-size:13px;color:var(--muted);margin:10px 2px;display:flex;flex-direction:column;gap:4px}
.notice{background:#fff8e6;border:1px solid #ecd9a6;border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
/* risultati */
.summary{color:var(--muted);font-size:14px;margin:4px 2px 12px}
.seg{display:inline-flex;background:#ece5d6;border-radius:10px;padding:3px;margin:0 0 10px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.hit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 9px;cursor:pointer}
.hit:active{background:#f7f2e7}
.hit .ctx{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.hit .ctx .doc{color:var(--navy2);font-weight:600}
.hit .tx{font-family:var(--serif);font-size:16px;line-height:1.5}
.group h3{font-size:15px;margin:18px 2px 8px;color:var(--navy);display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.group h3 .k{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
.more{font-size:13px;color:var(--navy2);padding:2px 4px 8px;cursor:pointer}
mark{background:var(--mark);border-radius:2px;padding:0 1px;color:inherit}
mark.cur{background:var(--cur)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.ans{background:#edf5f0;border:1px solid #cfe0f3;border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none}
body.can-ask .ans{display:block}
.ans h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
.ansbody p{margin:6px 0}.ansbody ul{margin:6px 0;padding-left:20px}
a.cit{color:var(--navy2);font-weight:600;cursor:pointer;white-space:nowrap}
.tool{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:14px}
.sm{font-size:12.5px;color:var(--muted);margin-left:8px}
/* lettore */
.rhead{position:sticky;top:0;z-index:5;background:#fbf8f2f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 12px}
.rhead .in{max-width:788px;margin:0 auto;display:flex;gap:8px;align-items:center}
.rhead .ti{flex:1;min-width:0}
.rhead .ti b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.rhead .st{font-size:11.5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 11px;font-size:13.5px;white-space:nowrap}
.rhead input{width:74px;font-size:16px;padding:5px 8px;border:1px solid var(--line);border-radius:16px;text-align:center}
.occ{display:none;max-width:788px;margin:6px auto 0;font-size:13px;color:var(--muted);align-items:center;gap:8px}
.occ.on{display:flex}
.reader{font-family:var(--serif);font-size:17.5px;line-height:1.62;max-width:720px;margin:0 auto;padding:10px 18px 60px}
.reader p{margin:.55em 0;white-space:pre-line}
.reader p.art{margin-top:1.05em}
.reader p.note{font-size:14.5px;color:#444;line-height:1.5}
.reader h2,.reader h3,.reader h4,.reader h5{font-family:var(--sans);color:var(--navy);line-height:1.25;margin:1.6em 0 .5em}
.reader h2{font-size:21px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.reader h3{font-size:17.5px}.reader h4{font-size:15.5px;color:var(--gold)}.reader h5{font-size:15px;color:var(--gold)}
.badge{font:650 13.5px var(--sans);background:var(--navy);color:#fff;border-radius:7px;padding:2px 7px;margin-right:7px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.badge.note{background:#8a8f99}
.badge small{font-weight:500;opacity:.8;margin-left:5px}
a.rf{color:var(--navy2);text-decoration:underline;text-decoration-color:#a5813f99;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
sup.nt{font:600 11.5px var(--sans);color:var(--gold);cursor:pointer;padding:0 2px}
.flash{animation:fl 1.6s}
@keyframes fl{0%{background:#ffe58a}100%{background:transparent}}
table.tb{border-collapse:collapse;width:100%;font:14.5px/1.4 var(--sans);margin:.8em 0;display:block;overflow-x:auto}
table.tb td,table.tb th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;min-width:70px}
table.tb th{background:var(--gold2);font-weight:600}
/* indice / pannelli */
#drawer,#peek{position:absolute;z-index:20;background:var(--card);box-shadow:0 0 30px #0004;display:none;flex-direction:column}
#drawer{top:0;bottom:0;left:0;width:min(86vw,360px)}
#drawer.on,#peek.on{display:flex}
#shade{position:absolute;inset:0;background:#0006;z-index:15;display:none}
#shade.on{display:block}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{flex:1;min-width:0;font-size:15px;line-height:1.25}
.x{border:0;background:#eee6d6;border-radius:50%;width:32px;height:32px;font-size:16px;flex:none}
.pbody{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 14px calc(18px + env(safe-area-inset-bottom));flex:1}
.toc a{display:block;padding:8px 6px;border-bottom:1px solid #f0eadc;font-size:14.5px;cursor:pointer;line-height:1.3}
.toc a.l2{padding-left:20px;font-size:13.5px;color:#444}
#peek{left:0;right:0;bottom:0;max-height:82%;border-radius:16px 16px 0 0}
@media(min-width:980px){#peek{left:auto;top:0;max-height:none;width:440px;border-radius:0}#shade.pk{display:none}body.pk #view{margin-right:440px}}
.ptext{font-family:var(--serif);font-size:16.5px;line-height:1.58}
.ptext p{margin:.5em 0;white-space:pre-line}
.ptext p.note{font-size:14px;color:#444}
.plab{font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{border:1px solid var(--line);background:#faf6ec;border-radius:14px;padding:5px 10px;font-size:13.5px;cursor:pointer}
.lk.top{border-color:var(--navy);background:#edf4ef}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pact button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--navy);color:#fff;font-size:14.5px}
.pact button.sec{background:#ece5d6;color:var(--ink)}
/* tavole */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px;white-space:nowrap;font-size:14.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filter{width:100%;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.gt{font:600 15px var(--sans);color:var(--navy);margin:18px 2px 4px}
.gn{font-size:13px;color:var(--muted);margin:0 2px 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.row .a{font-size:15.5px;line-height:1.4}
.row .f{font-size:14px;color:#333;margin-top:5px}
.row .f i{font-style:normal;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.row .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.mode{font-size:12.5px;border-radius:12px;padding:3px 9px;background:var(--gold2);color:#6b5320}
.mode.c{background:#e3efe6;color:#245c3b}.mode.p{background:#e3f0e8;color:#234a80}.mode.s{background:#f0e9f7;color:#553a7a}
footer{flex:none;display:none}
</style>
</head>

 for(const tv of out)for(const g of tv.groups){let who=tv.code==="A"?cfg.sgen:tv.code==="D"?cfg.bshs:(g.title.match(cfg.stopRe)||["",g.title])[1].replace(cfg.artRe,"");g.who=who.charAt(0).toUpperCase()+who.slice(1);
  const GT=g.title;g.mode=cfg.consenso.test(GT)?["c",cfg.m_c]:cfg.collegial.test(GT)?["s",cfg.m_s]:cfg.parere.test(GT)&&!cfg.propone.test(GT)?["p",cfg.m_p]:cfg.dasolo.test(GT)?["",cfg.m_solo]:cfg.propone.test(GT)?["",cfg.m_prop]:cfg.doveri.test(GT)?["",cfg.m_dov]:null}
 return out}

function renderTav(s){const v=$("#view");const d=byId[S.lang+"-15"];const cfg=TAVCFG[S.lang]||TAVCFG.it;const T=tavole(S.lang);const tab=TABS[s.tab]||TABS.chi;const tavs=T.filter(tv=>tab[1].includes(tv.code));
 const groups=tavs.flatMap(tv=>tv.groups);const whos=[...new Set(groups.map(g=>g.who))];const f=nz(s.f||"").trim().split(/\s+/).filter(Boolean);
 let h=`<div class="wrap"><div class="tabs">${Object.entries(TABS).map(([k,tb])=>`<button class="${k===(s.tab||"chi")?"on":""}" data-tab="${k}">${tb[0]}</button>`).join("")}</div>`;
 if(!d||!T.length){v.innerHTML=h+`<div class="empty">${esc(t("tav_unavailable"))}</div></div>`;return}

 h+=`<div id="tlist"></div><p class="summary" style="margin-top:18px">${esc(t("tav_source").split("{0}").join(tab[1].split("").join(", ")))}</p></div>`;
 v.innerHTML=h;v.scrollTop=0;
 const ua=t("unit_art").charAt(0).toUpperCase()+t("unit_art").slice(1);const tnone=t("tav_none");
 const draw=()=>{const ff=nz($("#tf").value).trim().split(/\s+/).filter(Boolean);let o="",tot=0;
  if(!ff.length&&!s.who&&tab[2])o+=`<p class="summary">${tab[2]}</p>`;
  for(const tv of tavs){for(const g of tv.groups){if(s.who&&g.who!==s.who)continue;const rows=g.rows.filter(i=>{const z=Z(d.b[i]);return ff.every(w=>z.includes(w))});if(!rows.length)continue;tot+=rows.length;
    o+=`<div class="gt">${esc(tv.groups.length>1||tv.code<"D"?(tv.code==="A"?cfg.sgenFull+" · ":"")+g.title:tv.title)}</div>`;if(g.note.length&&!ff.length)o+=`<div class="gn">${esc(g.note.join(" "))}</div>`;
    const hd=g.head||[];let ti=hd.findIndex(x=>cfg.tiRe.test(x));if(ti<0)ti=0;
    for(const i of rows){const cs=cells(d.b[i].x);o+=`<div class="row"><div class="a">${richRange(d,i,cs[ti][0],cs[ti][1],null)}</div>`;
     cs.forEach((c,k)=>{if(k===ti||k===cs.length-1)return;o+=`<div class="f"><i>${esc(hd[k]||"")}</i>${richRange(d,i,c[0],c[1],null)}</div>`});
     const last=cs[cs.length-1];o+=`<div class="m">${g.mode&&tab[1]==="ABCD"?`<span class="mode ${g.mode[0]}">${esc(g.who)} · ${g.mode[1]}</span>`:""}<span class="lk">${esc(ua)} ${richRange(d,i,last[0],last[1],null)}</span></div></div>`}}}
  $("#tlist").innerHTML=o||`<div class="empty">${esc(tnone)}</div>`};
 draw();$("#tf").oninput=()=>{CURV.f=$("#tf").value;draw()}}

 if(el=t.closest(".rf")){e.stopPropagation();const tg=target(el.dataset.t,el.dataset.k);if(tg)openPeek(tg.d,tg.i);return}

function refOf(d,b){return b.n?`${d.num} ${b.t==="n"?"nota":"n."} ${b.n}`:`${d.num} (sezione «${b.h||"—"}»)`}
function toolCerca({parole}){return rankQ(String(parole||"")).list.slice(0,10).map(c=>({rif:refOf(c.d,c.b),libro:c.d.title,sezione:c.b.h||"",testo:c.b.x.slice(0,1000)}))}
function toolLeggi({libro,numero,nota}){const d=scope().find(x=>x.num===String(libro).toLowerCase());if(!d)return{errore:"libro non trovato: "+libro};const i=d.b.findIndex(b=>b.n===+numero&&b.t===(nota?"n":"p"));if(i<0)return{errore:"numero non trovato"};return{rif:refOf(d,d.b[i]),libro:d.title,sezione:d.b[i].h||"",testo:artBlocks(d,i).map(k=>d.b[k].x).join("\n").slice(0,3500)}}
function mdLite(s){s=esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");s=s.replace(/\[(\d{2}[a-z]?) (n\.|nota) ?(\d+)\]/g,(m,l,k,n)=>`<a class="cit" data-cl="${l}|${k==="nota"?"n":"p"}|${n}">${m}</a>`);const out=[];let ul=false;for(const line of s.split(/\n/)){const m=line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(m){if(!ul){out.push("<ul>");ul=true}out.push("<li>"+m[1]+"</li>")}else{if(ul){out.push("</ul>");ul=false}if(line.trim())out.push("<p>"+line+"</p>")}}if(ul)out.push("</ul>");return out.join("")}

 const show=(txt,done)=>{box.innerHTML=`<h4>${esc(t("ans_title"))}</h4><div class="ansbody">${mdLite(txt||t("ask_searching"))}</div>${done?`<p class="sm" style="margin:8px 0 0">${esc(t("ask_verify"))}</p>`:""}`};show("");
 const prompt=`Sei l'assistente di ricerca sulla normativa dell'Istituto Figli di Sant'Anna (FSA). Rispondi in ${LANGFULL[S.lang]}, con precisione canonica e senza ornamenti.
Hai due strumenti: «cerca» (cerca i passi più pertinenti: passa parole chiave e sinonimi; usalo più volte con parole diverse) e «leggi» (legge per intero un articolo o una nota dato libro e numero).
Regole:
- Rispondi SOLO in base ai testi trovati con gli strumenti; non usare conoscenze esterne e non inventare articoli.
- Le Costituzioni (libro 01) prevalgono su tutti gli altri testi; il Direttorio (02), la Ratio (03) e i regolamenti le applicano. Parti sempre da ciò che dicono le Costituzioni, poi il Direttorio, poi i regolamenti. Se due testi sembrano divergere, dillo chiaramente.
- Se la risposta dipende da un caso (chi, quando, con quale consenso), distingui i casi.
- Cita ogni affermazione con il riferimento esatto fra parentesi quadre nel formato [01 n. 21] oppure [02 nota 5] (numero del libro + numero dell'articolo).
- Struttura: prima una risposta breve (2-4 righe), poi i dettagli a punti con le citazioni; infine, solo se serve, una riga su ciò che nei testi non si trova.
Lingua dei testi consultati: ${S.lang.toUpperCase()}.

DOMANDA: ${q}`;
 try{const r=await SAMPLE(prompt,{signal:ASKCTRL.signal,cache:false,modelTier:"default",onText:({text})=>show(text),tools:[
  {name:"cerca",description:"Cerca nella normativa i passi più pertinenti a delle parole chiave (con sinonimi). Restituisce fino a 10 passi con riferimento, sezione e testo.",inputSchema:{type:"object",properties:{parole:{type:"string",description:"parole chiave e sinonimi separati da spazi"}},required:["parole"]},execute:async i=>toolCerca(i)},
  {name:"leggi",description:"Legge per intero un articolo (o una nota) di un libro.",inputSchema:{type:"object",properties:{libro:{type:"string",description:"numero del libro, es. 01, 02, 06a, 15"},numero:{type:"integer"},nota:{type:"boolean",description:"true se è il numero di una nota"}},required:["libro","numero"]},execute:async i=>toolLeggi(i)}]});show(r.text,true)}
 catch(e){box.innerHTML=`<h4>${esc(t("ans_title"))}</h4><p>${e&&e.code==="rate_limited"?esc(t("ask_rate")):esc(t("ask_fail").split("{0}").join(String(e&&(e.message||e.code)||e)))}</p><button class="tool" onclick="askClaude()">${esc(t("ask_retry"))}</button>`}}
